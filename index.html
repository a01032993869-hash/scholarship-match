<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장학매치 | 나에게 맞는 장학금</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="장학매치 홈"><span class="brand-mark">✦</span> 장학매치</a>
        <button class="saved-link" id="savedButton" type="button">♡ 찜한 공고 <span id="savedCount">0</span></button>
      </header>

      <section class="hero" id="onboarding">
        <div class="eyebrow">STUDENT SCHOLARSHIP FINDER</div>
        <h1>3초 만에<br /><em>나에게 맞는 장학금</em> 찾기</h1>
        <p>흩어진 장학금과 청년 지원 정보를 한곳에서 확인하고<br class="desktop-only" /> 마감 전에 놓치지 않도록 알려드려요.</p>
        <button class="kakao-button" id="kakaoButton" type="button"><span>●</span> 카카오로 1분 만에 시작하기</button>
        <p class="login-note">가입 없이, 필요한 정보 3가지만 입력해요.</p>
      </section>

      <section class="profile-panel" id="profilePanel" hidden>
        <div class="step-label"><span>1</span> 나의 기본 정보</div>
        <h2>간단한 정보로 맞춤 공고를 찾아드릴게요.</h2>
        <p class="panel-sub">입력한 정보는 장학금 자격 조건 확인에만 사용됩니다.</p>
        <form id="profileForm" novalidate>
          <label>학교명
            <input id="school" maxlength="30" placeholder="예: 경기대학교" autocomplete="organization" />
          </label>
          <label>학년
            <select id="grade"><option value="">학년을 선택하세요</option><option>1학년</option><option>2학년</option><option>3학년</option><option>4학년</option><option>대학원</option><option>휴학/졸업예정</option></select>
          </label>
          <label>거주지
            <select id="region"><option value="">거주 지역을 선택하세요</option><option>서울</option><option>경기</option><option>인천</option><option>부산</option><option>대구</option><option>대전</option><option>광주</option><option>기타 지역</option></select>
          </label>
          <p class="form-error" id="formError" role="alert"></p>
          <button class="primary-button" type="submit">맞춤 장학금 확인하기 <span>→</span></button>
        </form>
      </section>

      <section class="results" id="results" hidden>
        <div class="result-head">
          <div><span class="eyebrow">FOR YOU</span><h2><strong id="userName">학생</strong>님을 위한<br />맞춤 공고 <span id="resultCount">0</span>건</h2></div>
          <button class="profile-edit" id="editButton" type="button">정보 수정</button>
        </div>
        <div class="filter-row" role="tablist" aria-label="공고 분류">
          <button class="chip active" data-filter="all" type="button">전체</button><button class="chip" data-filter="장학금" type="button">장학금</button><button class="chip" data-filter="생활비" type="button">생활비</button><button class="chip" data-filter="주거" type="button">주거</button><button class="chip" data-filter="취업" type="button">취업 지원</button>
        </div>
        <div class="notice"><span>🔔</span> 찜한 공고는 D-7, D-3, 마감 당일에 알려드려요.</div>
        <div class="card-grid" id="cardGrid"></div>
      </section>
    </main>

    <dialog id="detailDialog" class="detail-dialog">
      <button class="close" id="closeDialog" aria-label="닫기">×</button>
      <div id="detailContent"></div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
